name: Windows 11 Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies and run checks
        run: |
          bun install
          bun run check

      - name: Setup Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unnecessary-lazy-evaluations -A clippy::manual-range-contains -A clippy::bool-assert-comparison -A clippy::permissions-set-readonly-false

      - name: Run Rust unit & integration tests
        run: cargo test --workspace

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows 11 NSIS installer
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-tracker-windows-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
